services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bravo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD no .env}
      POSTGRES_DB: bravo_ii_hml
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - bravo_ii_hml_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U bravo -d bravo_ii_hml"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  bravo_ii_hml_db:
